[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2", "wheel"]
build-backend = "setuptools.build_meta"

###############################################################################
# Project
###############################################################################
[project]
name = "spinspg"
dynamic = ["version"]
readme = "README.md"
description = "Python package for detecting spin space group on top of spglib"
authors = [
    {name = "Kohei Shinohara", email = "kshinohara0508@gmail.com"},
]
requires-python = ">=3.10.0"
license = {file = "LICENSE"}
classifiers = [
    # Full list: https://pypi.python.org/pypi?%3Aaction=list_classifiers
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "setuptools",
    "setuptools_scm",
    "wheel",
    "typing_extensions",
    "numpy>=1.20.1",
    "spglib>=2.5",
    "hsnf>=0.3.15",  # Hermite normal form
    "spgrep>=0.3.2",
]

[project.urls]
homepage = "https://github.com/spglib/spinspg"
repository = "https://github.com/spglib/spinspg"

[project.optional-dependencies]
dev = [
    "spgrep-modulation>=0.2.5",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "black",
    "mypy",
    "toml",
]
docs = [
    "importlib-metadata",
    "sphinx",
    "sphinx-autobuild",
    "myst-parser",
    "sphinx-book-theme",
    "linkify-it-py",
    "enum-tools[sphinx]",
]

###############################################################################
# Setuptools
###############################################################################

[tool.setuptools]
zip-safe = false

# packages = find
# package-dir = {"" = "src"}
#
# [tool.setuptools.packages.find]
# where = ["src"]
# include = ["spinspg"]

###############################################################################
# Other tools
###############################################################################

# Enable version inference
[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests", "exp"]
line-length = 99
exclude = [
    'docs',
]
[tool.ruff.lint]
extend-select = [
    "F",           # pyflakes
    "E",           # pycodestyle-errors
    "I",           # isort
    "UP",          # pyupgrade
    "TC",
]
ignore = [
    "E501",
    "W605",
]

[tool.mypy]
exclude = [
  'docs',
]
warn_no_return = false
